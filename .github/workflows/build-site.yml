name: Build public site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-public-site:
    name: build-public-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node src/cli.mjs build
