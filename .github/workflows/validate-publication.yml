name: Validate publication package

on:
  pull_request:
    paths: ['generated/**', 'src/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-publication-package:
    name: validate-publication-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node src/cli.mjs validate
