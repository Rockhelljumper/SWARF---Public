name: Validate publication package

on:
  pull_request:
    paths: ['generated/**', 'src/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-publication-package:
    name: validate-publication-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node src/cli.mjs validate
