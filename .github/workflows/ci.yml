name: Public CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-validation:
    name: public-publication-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm link-check
